openapi: 3.1.0
info:
  title: TemanUsaha AI Actions API
  version: 0.1.0
  description: Minimal GPT Actions API for the Warung Nasi Bu Sari hackathon demo.
servers:
  - url: https://api.temanusaha.example.com
security:
  - ApiKeyAuth: []
paths:
  /api/orders:
    post:
      operationId: create_order
      summary: Create a new food order
      description: Creates an order, updates inventory, and writes an AI action log. This does not process payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
    get:
      operationId: list_pending_orders
      summary: List pending orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, completed, all]
            default: pending
      responses:
        "200":
          description: Orders returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"

  /api/orders/{id}:
    patch:
      operationId: update_order
      summary: Update order status or payment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
                  aiActionLog:
                    $ref: "#/components/schemas/AIActionLog"

  /api/inventory/low-stock:
    get:
      operationId: get_low_stock_items
      summary: Get low stock items
      responses:
        "200":
          description: Low stock items returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"

  /api/summary/today:
    get:
      operationId: get_daily_summary
      summary: Get today's warung summary
      responses:
        "200":
          description: Daily summary returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySummary"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Action-API-Key
  schemas:
    CreateOrderRequest:
      type: object
      required: [customerName, items, pickupTime, paymentStatus]
      properties:
        customerName:
          type: string
          example: Bu Rina
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
                example: nasi-ayam
              quantity:
                type: integer
                minimum: 1
                example: 3
        pickupTime:
          type: string
          format: date-time
          example: "2026-07-18T12:30:00+07:00"
        paymentStatus:
          type: string
          enum: [UNPAID, PAID, PARTIAL]
          example: UNPAID
        notes:
          type: string
    CreateOrderResponse:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
        inventoryUpdates:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              productName: { type: string }
              previousStock: { type: integer }
              newStock: { type: integer }
              quantityUsed: { type: integer }
        aiActionLog:
          $ref: "#/components/schemas/AIActionLog"
    UpdateOrderRequest:
      type: object
      properties:
        paymentStatus:
          type: string
          enum: [UNPAID, PAID, PARTIAL]
        fulfillmentStatus:
          type: string
          enum: [PENDING, COMPLETED, CANCELLED]
        notes:
          type: string
    Order:
      type: object
      properties:
        id: { type: string }
        customerName: { type: string }
        total: { type: number }
        paymentStatus: { type: string }
        fulfillmentStatus: { type: string }
        pickupTime: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              productName: { type: string }
              quantity: { type: integer }
              unitPrice: { type: number }
              lineTotal: { type: number }
    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number }
        stock: { type: integer }
        lowStockThreshold: { type: integer }
    DailySummary:
      type: object
      properties:
        date: { type: string, format: date }
        orderCount: { type: integer }
        recordedRevenue: { type: number }
        unpaidOrderCount: { type: integer }
        pendingOrderCount: { type: integer }
        lowStockItems:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        aiActionLogs:
          type: array
          items:
            $ref: "#/components/schemas/AIActionLog"
    AIActionLog:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        requestedBy: { type: string }
        source: { type: string, example: gpt }
        inputSummary: { type: string }
        outputSummary: { type: string }
        requiresVerification: { type: boolean }
        createdAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: array
              items: { type: string }
