<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" color="#17211b">
  <!--
    Asisten Pribadi AI mark — portable copy for non-React consumers (the
    presentation deck). Geometry and construction notes live in app/icon.svg.

    Deliberately NOT wired to prefers-color-scheme: the deck pins
    `color-scheme: light` on :root, so an OS-driven flip would paint the mark
    near-white on a cream slide. The `color` attribute below is the light-surface
    value; use mark-inverse.svg on the deck's dark-slide class. Fill stays
    currentColor so a
    consumer that inlines this file, or uses it as a CSS mask-image, still tracks
    the surrounding text colour.
  -->
